<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FAF5EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1510" media="(prefers-color-scheme: dark)">
<title>El Sol — меню</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kelly+Slab&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: wood-and-paper menu book; sticky tabs + section chips, item rows in 1–2 columns, order sheet at the bottom */
:root{
  --bg:#FAF5EE; --surface:#FFFFFF; --sunk:#F1E8DC; --fg:#2E1D14; --muted:#7A6556; --line:#E6D9C9;
  --accent:#D9692C; --accent-ink:#FFFFFF; --chili:#B23A26; --agave:#56724A;
  --display:"Kelly Slab", Georgia, "Times New Roman", serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1F1510; --surface:#2A1C15; --sunk:#33231A; --fg:#F4E8DA; --muted:#BBA48F; --line:#45311F;
  --accent:#F0874A; --accent-ink:#1F1510; --chili:#E46A52; --agave:#93B282; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1F1510; --surface:#2A1C15; --sunk:#33231A; --fg:#F4E8DA; --muted:#BBA48F; --line:#45311F;
  --accent:#F0874A; --accent-ink:#1F1510; --chili:#E46A52; --agave:#93B282; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}

/* masthead */
.mast{padding-block:28px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.sun{width:52px;height:52px;flex:none}
.wordmark{font-family:var(--display);font-size:44px;line-height:1;letter-spacing:.01em;margin:0}
.wordmark b{color:var(--accent);font-weight:400}
.tag{margin:4px 0 0;color:var(--muted);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.hola{color:var(--muted);font-size:13px;max-width:34ch;text-align:right}
@media (max-width:560px){.hola{text-align:left}}

/* sticky controls */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-direction:column;gap:10px;padding-block:10px}
.row1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:inline-flex;background:var(--sunk);border-radius:999px;padding:4px;gap:2px}
.tab{border:0;background:transparent;padding:8px 18px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:9px 36px 9px 38px;font:inherit}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:28px;height:28px;border-radius:50%;cursor:pointer;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--fg);white-space:nowrap}
.chip.on{border-color:var(--accent);color:var(--accent)}

/* sections */
main{padding-block:8px 120px}
.sec{padding-top:28px;scroll-margin-top:130px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 4px}
.sec-h h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
.sec-h .es{font-family:var(--display);color:var(--accent);font-size:20px}
.sec-note{color:var(--muted);font-size:13px;margin:2px 0 0}
.sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted);margin:22px 0 2px;display:flex;align-items:center;gap:10px}
.sub::after{content:"";flex:1;height:1px;background:var(--line)}
.sub .subnote{letter-spacing:0;text-transform:none;font-weight:600;color:var(--fg)}
.grid{display:grid;grid-template-columns:1fr;column-gap:36px;margin-top:6px}
@media (min-width:820px){.grid{grid-template-columns:1fr 1fr}}

.item{display:flex;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line);min-width:0}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item h3{margin:0;font-size:16px;font-weight:800;line-height:1.25}
.item h3 .v{font-weight:600;color:var(--muted)}
.item p{margin:0;color:var(--muted);font-size:14px}
.item .note{font-size:12px;color:var(--muted);font-style:italic}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.w{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.price{font-weight:800;font-variant-numeric:tabular-nums;font-size:16px}
.add{border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;height:32px;min-width:32px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px;transition:background .15s,color .15s}
.add:hover{background:var(--accent);color:var(--accent-ink)}
.add .q{display:none}
.add.has{background:var(--accent);color:var(--accent-ink)}
.add.has .q{display:inline}
.opt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:3px 3px 3px 12px;background:var(--surface)}
.opt .lbl{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.opt .price{font-size:15px}
.opt .add{height:28px;min-width:28px}
.solo{margin-left:auto;display:flex;align-items:center;gap:10px}
.ph{flex:none;width:118px;height:96px;border-radius:10px;overflow:hidden;background:var(--sunk);cursor:zoom-in;border:0;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:420px){.ph{width:96px;height:84px}}
.empty{padding:40px 0;color:var(--muted);text-align:center}
mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:3px}

/* phrasebook */
.phr{margin-top:48px;border-top:1px solid var(--line);padding-top:24px}
.phr h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 12px}
.phr dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 28px;margin:0}
.phr div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--line);padding:5px 0}
.phr dt{color:var(--muted)}
.phr dd{margin:0;font-weight:700;font-style:italic;text-align:right}

/* order bar + sheet */
.obar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.obtn{pointer-events:auto;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:16px;background:var(--fg);color:var(--bg);padding:13px 18px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:700}
.obtn .cnt{background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;padding:0 7px;font-variant-numeric:tabular-nums}
.obtn .sum{margin-left:auto;font-variant-numeric:tabular-nums;font-size:17px}
.scrim{position:fixed;inset:0;background:rgba(20,10,5,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:20px 20px 0 0;max-height:86vh;display:flex;flex-direction:column;max-width:640px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px;gap:12px}
.sh-h h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.icon{border:0;background:var(--sunk);width:36px;height:36px;border-radius:50%;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.lines{overflow-y:auto;padding:0 16px;flex:1}
.line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.line .ln{flex:1;min-width:0}
.line .ln b{display:block;font-weight:700}
.line .ln span{font-size:13px;color:var(--muted)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.step button{border:0;background:transparent;width:32px;height:32px;cursor:pointer;font-size:18px;font-weight:700}
.step output{min-width:22px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.line .lp{width:76px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.sh-f{padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.tot .v{font-size:24px;font-variant-numeric:tabular-nums}
.fine{font-size:12px;color:var(--muted);margin:0}
.clear{align-self:flex-start;border:0;background:transparent;color:var(--chili);font-weight:700;cursor:pointer;padding:4px 0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.confirm button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700}
.confirm .yes{background:var(--chili);border-color:var(--chili);color:#fff}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(15,8,4,.86);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lb figure{margin:0;max-width:640px;width:100%}
.lb img{width:100%;border-radius:14px;display:block}
.lb figcaption{color:#F4E8DA;margin-top:10px;font-weight:700;text-align:center}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>


<header class="wrap mast">
  <div class="brand">
    <svg class="sun" viewBox="0 0 64 64" aria-hidden="true"><g fill="var(--accent)"><circle cx="32" cy="32" r="13"/><g id="ray"><path d="M32 2l4 12h-8z"/></g><use href="#ray" transform="rotate(30 32 32)"/><use href="#ray" transform="rotate(60 32 32)"/><use href="#ray" transform="rotate(90 32 32)"/><use href="#ray" transform="rotate(120 32 32)"/><use href="#ray" transform="rotate(150 32 32)"/><use href="#ray" transform="rotate(180 32 32)"/><use href="#ray" transform="rotate(210 32 32)"/><use href="#ray" transform="rotate(240 32 32)"/><use href="#ray" transform="rotate(270 32 32)"/><use href="#ray" transform="rotate(300 32 32)"/><use href="#ray" transform="rotate(330 32 32)"/></g><circle cx="32" cy="32" r="8" fill="var(--bg)"/></svg>
    <div>
      <h1 class="wordmark">el<b>·</b>sol</h1>
      <p class="tag">мексиканская кухня</p>
    </div>
  </div>
  <p class="hola">Нажмите «+», чтобы собрать заказ и сразу увидеть сумму. Вес указан в граммах, объём напитков в миллилитрах.</p>
</header>

<div class="bar">
  <div class="wrap bar-in">
    <div class="row1">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-kitchen" data-tab="kitchen" aria-selected="true">Кухня</button>
        <button class="tab" role="tab" id="tab-bar" data-tab="bar" aria-selected="false">Бар</button>
      </div>
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Найти блюдо или напиток" autocomplete="off" aria-label="Поиск по меню">
        <button class="x" id="qx" type="button" aria-label="Очистить поиск" hidden>✕</button>
      </label>
    </div>
    <nav class="chips" id="chips" aria-label="Разделы меню"></nav>
  </div>
</div>

<main class="wrap" id="menu"></main>

<div class="wrap" style="padding-block:0 140px">
  <section class="phr" aria-labelledby="phr-h">
    <h2 id="phr-h">Словарик El Sol</h2>
    <dl id="phr"></dl>
  </section>
</div>

<div class="obar" id="obar" hidden><button class="obtn" id="obtn" type="button"><span>Мой заказ</span><span class="cnt" id="ocnt">0</span><span class="sum" id="osum">0 ₽</span></button></div>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title" hidden>
  <div class="sh-h"><h2 id="sh-title">Мой заказ</h2><button class="icon" id="shx" type="button" aria-label="Закрыть">✕</button></div>
  <div class="lines" id="lines"></div>
  <div class="sh-f">
    <div class="tot"><span>Итого по меню</span><span class="v" id="stot">0 ₽</span></div>
    <p class="fine">Это подсказка для расчёта, а не отправленный заказ. Покажите список официанту.</p>
    <div id="clearbox"><button class="clear" id="clr" type="button">Очистить заказ</button></div>
  </div>
</section>
<div class="lb" id="lb" hidden><figure><img id="lbimg" alt=""><figcaption id="lbcap"></figcaption></figure></div>

let query="";

// index items with stable keys
const ITEMS={};
MENU.forEach(s=>s.groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{
  it.key=s.id+"."+gi+"."+ii; it.sec=s;
  const opts=it.info?[]:(it.o||[[it.w||"",it.p]]);
  it.opts=opts.map((o,oi)=>({k:it.key+":"+oi,label:o[0],price:o[1]}));
  it.opts.forEach(o=>ITEMS[o.k]={it,o});
  it.hay=(it.n+" "+(it.v||"")+" "+(it.d||"")+" "+s.t+" "+(g.sub||"")).toLowerCase().replace(/ё/g,"е");
})));
Object.keys(cart).forEach(k=>{if(!ITEMS[k])delete cart[k]});

function hl(text){
  if(!query) return esc(text);
  const t=esc(text), q=query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/е/g,"[её]");
  return t.replace(new RegExp("("+q+")","gi"),"<mark>$1</mark>");
}
function addBtn(o,label){
  const q=cart[o.k]||0;
  return `<button class="add${q?" has":""}" data-k="${o.k}" aria-label="Добавить ${esc(label)}"><span class="q">${q}</span><span aria-hidden="true">+</span></button>`;
}
function itemHTML(it){
  const title=`${hl(it.n)}${it.v?` <span class="v">· ${hl(it.v)}</span>`:""}`;
  let meta="";
  if(it.info){meta="";}
  else if(it.o){meta=`<div class="meta">${it.opts.map(o=>`<span class="opt"><span class="lbl">${esc(o.label)}</span><span class="price">${rub(o.price)}</span>${addBtn(o,it.n+" "+o.label)}</span>`).join("")}</div>`;}
  else{const o=it.opts[0];meta=`<div class="meta">${it.w?`<span class="w">${esc(it.w)}</span>`:""}<span class="solo"><span class="price">${rub(o.price)}</span>${addBtn(o,it.n)}</span></div>`;}
  const ph=it.img&&IMG[it.img]?`<button class="ph" data-img="${it.img}" data-cap="${esc(it.n)}" aria-label="Фото: ${esc(it.n)}"><img src="${IMG[it.img]}" alt="${esc(it.n)}" loading="lazy"></button>`:"";
  return `<article class="item">${ph}<div class="body"><h3>${title}</h3>${it.d?`<p>${hl(it.d)}</p>`:""}${it.note?`<span class="note">${esc(it.note)}</span>`:""}${meta}</div></article>`;
}
function render(){
  const q=query;
  let html="",chips="",found=0;
  MENU.forEach(s=>{
    if(!q && s.tab!==tab) return;
    let body="";
    s.groups.forEach(g=>{
      const list=g.items.filter(it=>!q||it.hay.includes(q));
      if(!list.length) return;
      found+=list.length;
      if(g.sub) body+=`<div class="sub">${esc(g.sub)}</div>`;
      body+=`<div class="grid">${list.map(itemHTML).join("")}</div>`;
    });
    if(!body) return;
    const tabLabel=q?`<span class="sec-note">${s.tab==="bar"?"Бар":"Кухня"}</span>`:"";
    html+=`<section class="sec" id="s-${s.id}"><div class="sec-h"><h2>${esc(s.t)}</h2>${s.es?`<span class="es">${esc(s.es)}</span>`:""}${tabLabel}</div>${s.note?`<p class="sec-note">${esc(s.note)}</p>`:""}${body}</section>`;
    chips+=`<button class="chip" data-go="s-${s.id}">${esc(s.t)}</button>`;
  });
  if(q&&!found) html=`<p class="empty">По запросу «${esc(query)}» ничего не нашлось. Попробуйте другое слово, например «креветки» или «текила».</p>`;
  $("#menu").innerHTML=html; $("#chips").innerHTML=chips;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab&&!q)));
  spy();
}
function renderCart(){
  const keys=Object.keys(cart).filter(k=>cart[k]>0);
  let n=0,sum=0;
  keys.forEach(k=>{n+=cart[k];sum+=cart[k]*ITEMS[k].o.price});
  $("#obar").hidden=n===0; $("#ocnt").textContent=n; $("#osum").textContent=rub(sum); $("#stot").textContent=rub(sum);
  $("#lines").innerHTML=keys.length?keys.map(k=>{const {it,o}=ITEMS[k];const sub=[it.v,o.label,it.sec.t].filter(Boolean).join(" · ");
    return `<div class="line"><div class="ln"><b>${esc(it.n)}</b><span>${esc(sub)} · ${rub(o.price)}</span></div><div class="step"><button data-dec="${k}" aria-label="Меньше">−</button><output>${cart[k]}</output><button data-inc="${k}" aria-label="Больше">+</button></div><div class="lp">${rub(o.price*cart[k])}</div></div>`}).join("")
    :`<p class="empty">Заказ пуст. Нажмите «+» рядом с блюдом.</p>`;
  document.querySelectorAll(".add[data-k]").forEach(b=>{const q=cart[b.dataset.k]||0;b.classList.toggle("has",q>0);b.querySelector(".q").textContent=q});
  store.set("elsol.cart",cart);
  if(!n) closeSheet();
}
function bump(k,d){cart[k]=Math.max(0,(cart[k]||0)+d);if(!cart[k])delete cart[k];renderCart()}

/* scroll spy for chips */
let spyT;
function spy(){
  const secs=[...document.querySelectorAll(".sec")];const y=170;let cur=secs[0];
  secs.forEach(s=>{if(s.getBoundingClientRect().top<y)cur=s});
  document.querySelectorAll(".chip").forEach(c=>{const on=cur&&c.dataset.go===cur.id;if(on&&!c.classList.contains("on")){c.classList.add("on");c.scrollIntoView({inline:"nearest",block:"nearest"})}else if(!on)c.classList.remove("on")});
}
addEventListener("scroll",()=>{cancelAnimationFrame(spyT);spyT=requestAnimationFrame(spy)},{passive:true});

/* events */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,.lb");if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;store.set("elsol.tab",tab);if(query){query="";$("#q").value="";$("#qx").hidden=true}render();scrollTo({top:0});return}
  if(t.dataset.go){const el=document.getElementById(t.dataset.go);if(el)scrollTo({top:el.getBoundingClientRect().top+scrollY-($(".bar").offsetHeight+8),behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return}
  if(t.dataset.k){bump(t.dataset.k,1);return}
  if(t.dataset.inc){bump(t.dataset.inc,1);return}
  if(t.dataset.dec){bump(t.dataset.dec,-1);return}
  if(t.dataset.img){$("#lbimg").src=IMG[t.dataset.img];$("#lbimg").alt=t.dataset.cap;$("#lbcap").textContent=t.dataset.cap;$("#lb").hidden=false;return}
  if(t.id==="lb"){$("#lb").hidden=true;return}
  if(t.id==="obtn"){openSheet();return}
  if(t.id==="shx"){closeSheet();return}
  if(t.id==="qx"){query="";$("#q").value="";t.hidden=true;render();$("#q").focus();return}
  if(t.id==="clr"){$("#clearbox").innerHTML=`<div class="confirm"><span>Удалить все позиции?</span><button class="yes" id="clryes">Удалить</button><button id="clrno">Оставить</button></div>`;return}
  if(t.id==="clryes"){cart={};resetClear();renderCart();return}
  if(t.id==="clrno"){resetClear();return}
});
$("#lb").addEventListener("click",()=>$("#lb").hidden=true);
$("#scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSheet();$("#lb").hidden=true}});
function resetClear(){$("#clearbox").innerHTML=`<button class="clear" id="clr" type="button">Очистить заказ</button>`}
function openSheet(){$("#sheet").hidden=false;$("#scrim").hidden=false;$("#shx").focus()}
function closeSheet(){$("#sheet").hidden=true;$("#scrim").hidden=true;resetClear()}
let qT;
$("#q").addEventListener("input",e=>{clearTimeout(qT);qT=setTimeout(()=>{query=e.target.value.trim().toLowerCase().replace(/ё/g,"е");$("#qx").hidden=!query;render()},120)});

$("#phr").innerHTML=PHRASES.map(([ru,es])=>`<div><dt>${ru}</dt><dd lang="es">${es}</dd></div>`).join("");
render();renderCart();
</script>

</body>
</html>
